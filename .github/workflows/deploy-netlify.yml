name: Deploy Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build SPA with Supabase
        env:
          # Public anon keys (same as netlify.toml). Override via secrets if project moves.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://ukhdjvbzbidxoieauhpr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_IOtt2j4pbij2NsubjfBPNQ_O9Z3O_mS' }}
        run: |
          pnpm --filter @workspace/adspot-unified run build
          grep -q 'supabase.co' app/dist/assets/*.js
      - name: Deploy to Netlify prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 913fed63-eeb2-4974-b5f0-7f8833232f81
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Missing NETLIFY_AUTH_TOKEN secret — Netlify Git auto-deploy + netlify.toml bake will still apply."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=app/dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "GHA deploy ${GITHUB_SHA}"
